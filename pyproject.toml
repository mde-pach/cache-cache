[project]
name = "cache-cache"
version = "0.3.0"
description = "Async caching for Python: dedupe, per-request sessions, invisible batching, hierarchical tags, checked at startup."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "mde-pach" }]
keywords = ["cache", "asyncio", "dataloader", "batching", "redis", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5.0"]
pydantic = ["pydantic>=2.0"]

[project.scripts]
cache-cache = "cache_cache.check:main"

[project.urls]
Homepage = "https://github.com/mde-pach/cache-cache"
Documentation = "https://mde-pach.github.io/cache-cache/"
Issues = "https://github.com/mde-pach/cache-cache/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "fakeredis>=2.26",
    "redis>=5.0",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.8",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cache_cache"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "ASYNC"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "RUF", "ASYNC110"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/cache_cache"]
